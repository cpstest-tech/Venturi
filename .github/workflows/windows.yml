name: Windows

# Called by Release; can also be run by hand to get the files as artifacts.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [windows-build]

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # ggml's nested CMake builds exceed MAX_PATH under the workspace;
      # Ninja also avoids MSBuild's even deeper .tlog folders.
      CARGO_TARGET_DIR: C:\t
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # cl.exe and the SDK on PATH, which Ninja needs.
      - uses: ilammy/msvc-dev-cmd@v1

      # whisper-rs builds ggml's Vulkan backend: headers, loader and glslc.
      - uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true

      - name: Install Inno Setup and Ninja
        run: |
          command -v ninja || choco install ninja -y --no-progress
          command -v iscc || choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> "$GITHUB_PATH"

      - name: Cache key
        id: cache-key
        run: echo "hash=$(grep -v '^version = ' Cargo.toml | cat - .cargo/config.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.cache-key.outputs.hash }}
          workspaces: ". -> C:\\t"

      # After rust-cache, whose cleanup would otherwise empty it first.
      - uses: actions/cache@v6
        with:
          path: C:\t\ffmpeg-windows
          key: ffmpeg-windows-${{ hashFiles('scripts/build-windows.sh') }}

      # Git's coreutils `link` would shadow MSVC's link.exe on PATH.
      - name: Build
        run: |
          rm -f /usr/bin/link.exe
          scripts/build-windows.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Tandem-windows-x64
          path: |
            C:\t\windows\Tandem-windows-x64.zip
            C:\t\windows\Tandem-windows-x64-setup.exe
          if-no-files-found: error

  # The code paths only Windows takes; the GPU and audio tests need hardware
  # the runner lacks.
  test:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # ggml's nested CMake builds exceed MAX_PATH under the workspace;
      # Ninja also avoids MSBuild's even deeper .tlog folders.
      CARGO_TARGET_DIR: C:\t
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # cl.exe and the SDK on PATH, which Ninja needs.
      - uses: ilammy/msvc-dev-cmd@v1

      # whisper-rs builds ggml's Vulkan backend: headers, loader and glslc.
      - uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true

      - name: Install Inno Setup and Ninja
        run: |
          command -v ninja || choco install ninja -y --no-progress
          command -v iscc || choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> "$GITHUB_PATH"

      - name: Cache key
        id: cache-key
        run: echo "hash=$(grep -v '^version = ' Cargo.toml | cat - .cargo/config.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.cache-key.outputs.hash }}-test
          workspaces: ". -> C:\\t"

      # After rust-cache, whose cleanup would otherwise empty it first.
      - uses: actions/cache@v6
        with:
          path: C:\t\ffmpeg-windows
          key: ffmpeg-windows-${{ hashFiles('scripts/build-windows.sh') }}

      - name: Test
        run: |
          rm -f /usr/bin/link.exe
          scripts/build-windows.sh --fetch-ffmpeg
          export FFMPEG_DIR="$(cygpath -w 'C:\t\ffmpeg-windows')"
          export PATH="/c/t/ffmpeg-windows/bin:$PATH"
          cargo test -p vv-app --bin tandem -- ai_sequence::render ai_sequence::process ai_sequence::setup home:: hw_decode
