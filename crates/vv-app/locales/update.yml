_version: 2

update.available_title:
  en: "Update available"
  it: "Aggiornamento disponibile"

update.available:
  en: "Tandem %{version} is available (you have %{current}). Do you want to update?"
  it: "È disponibile Tandem %{version} (hai la %{current}). Vuoi aggiornare?"

update.release_notes:
  en: "What's new"
