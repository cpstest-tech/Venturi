  en: "Ignore this release"
  it: "Ignora questa release"

update.downloading:
  en: "Downloading Tandem %{version}…"
  it: "Download di Tandem %{version}…"

update.ready_title:
  en: "Update ready"
  it: "Aggiornamento pronto"

update.ready_restart:
  en: "The new version is installed. Restart Tandem to use it."
  it: "La nuova versione è installata. Riavvia Tandem per usarla."

