  it: "Impossibile cercare aggiornamenti: %{error}"

update.open_page:
  en: "Open download page"
  it: "Apri la pagina di download"

update.up_to_date:
  en: "Tandem %{version} is the latest version."
  it: "Tandem %{version} è l'ultima versione."

update.ok:
  en: "OK"
  it: "OK"

update.check_menu:
  en: "Check for updates…"
