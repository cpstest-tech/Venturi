style_pack.builtin_clean:
  en: "Clean"
  it: "Pulito"
style_pack.builtin_clean_desc:
  en: "Interviews and tutorials: classic captions, gentle zooms, dissolves, music well below the voice."
  it: "Interviste e tutorial: sottotitoli classici, zoom leggeri, dissolvenze, musica ben sotto la voce."
style_pack.builtin_dynamic:
  en: "Dynamic"
  it: "Dinamico"
style_pack.builtin_dynamic_desc:
  en: "TikTok and Reels energy: one word at a time, strong punch-ins, flashes, zoom transitions, an opening title."
  it: "Energia da TikTok e Reels: una parola alla volta, zoom decisi, flash, transizioni a zoom, titolo d'apertura."
style_pack.builtin_tech:
  en: "Tech"
  it: "Tech"
style_pack.builtin_tech_desc:
  en: "Keynote-like product videos: captions building word by word, soft slides, dips to black, elegant titles."
  it: "Video di prodotto in stile keynote: sottotitoli che si compongono, scorrimenti morbidi, passaggi dal nero, titoli eleganti."
style_pack.builtin_vlog:
  en: "Vlog"
  it: "Vlog"
style_pack.builtin_vlog_desc:
  en: "Warm and casual: yellow captions, side slides between shots, music a little louder."
  it: "Caldo e informale: sottotitoli gialli, scorrimenti laterali tra le inquadrature, musica un po' più alta."
style_pack.builtin:
  en: "Built-in"
  it: "Predefinito"
style_pack.builtin_locked:
  en: "Built-in packs cannot be changed: duplicate it to make your own."
  it: "I pacchetti predefiniti non si modificano: duplicalo per crearne uno tuo."
