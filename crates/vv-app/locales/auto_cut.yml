auto_cut.title:
  en: "Automatic cut"
  it: "Taglio automatico"
auto_cut.hint:
  en: "Review the suggestions. Checked regions will be removed in one undo step. Processing stays on this device."
  it: "Controlla i suggerimenti: le regioni spuntate saranno eliminate con un solo passaggio annullabile. Elaborazione sul dispositivo."
